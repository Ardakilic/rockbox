name: Test Build Rockbox Utility

# Test workflow — mirrors prod (build-rbutil.yml), manual trigger only.
# Runs in parallel with the main workflow.
# No release job — just compile + upload artifacts for inspection.
# macOS uses macos-15 (stable per GitHub notice, matching prod) with the
# same CI-local Carbon excise patch as prod (sed at build time, no base
# files modified); self-adapting no-op when Carbon headers are present.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x64
            ext: AppImage
            label: linux-x64

          - os: ubuntu-26.04-arm
            arch: arm64
            ext: AppImage
            label: linux-arm64

          - os: macos-15
            arch: arm64
            ext: dmg
            label: macos-arm64

          - os: windows-2025
            arch: x64
            ext: zip
            label: windows-x64

          - os: windows-11-arm
            arch: arm64
            ext: zip
            label: windows-arm64
            continue-on-error: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ═══════════════════════════════════════════════════════════════════
      # LINUX (x64 + arm64)
      # ═══════════════════════════════════════════════════════════════════
      - name: Install Qt6 and build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-svg-dev \
            qt6-multimedia-dev \
            qt6-5compat-dev \
            libqt6svgwidgets6 \
            libgl1-mesa-dev \
            libusb-1.0-0-dev \
            ninja-build

      # No file patching — direct build attempt (linuxdeploy workaround removed).

      - name: CMake Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S utils -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: CMake Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: CMake Deploy (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --target deploy

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: mv build/RockboxUtility.AppImage "build/RockboxUtility-${{ matrix.label }}.AppImage"

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: TestBuild-${{ matrix.label }}-${{ github.sha }}
          path: "build/RockboxUtility-${{ matrix.label }}.AppImage"
          if-no-files-found: error

      # macOS (arm64) — CI-local Carbon excise patch below (no base files modified).
      # ═══════════════════════════════════════════════════════════════════
      - name: Install Qt6 and Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 ninja
          echo "QT_PATH=/opt/homebrew/opt/qt@6" >> $GITHUB_ENV

      # CI-local sed patch, no base files modified (mirrors prod workflow).
      - name: Disable Carbon TTS if SDK lacks Carbon headers (macOS 15+)
        if: runner.os == 'macOS'
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          if [ -f "$SDK_PATH/System/Library/Frameworks/Carbon.framework/Headers/Carbon.h" ]; then
            echo "Carbon headers present - keeping Carbon TTS"
          else
            echo "Carbon headers missing - disabling Carbon TTS (CI-local patch, no base files committed)"
            sed -i '' '/#include "ttscarbon.h"/d' utils/rbutilqt/base/ttsbase.cpp
            sed -i '' '/ttsList.*"carbon".*\]/d' utils/rbutilqt/base/ttsbase.cpp
            sed -i '' 's/if(ttsName == "carbon")/if(false) \/* Carbon removed from macOS 15 SDK *\//' utils/rbutilqt/base/ttsbase.cpp
            sed -i '' 's/tts = new TTSCarbon(parent);/; \/* Carbon removed from macOS 15 SDK *\//' utils/rbutilqt/base/ttsbase.cpp
            # NOTE: heredoc body + closing EOF must sit at the run-block base
            # indent (10 spaces) — YAML strips the common indent, and bash
            # requires the terminator at column 0 while python rejects any
            # base indent. Do not re-indent this block.
            python3 - <<'EOF'
          p = 'utils/rbutilqt/CMakeLists.txt'
          lines = open(p).read().splitlines(keepends=True)
          out = []
          i, removed = 0, False
          while i < len(lines):
              if lines[i].strip() == 'if(APPLE)' and not removed:
                  j, depth = i + 1, 1
                  while j < len(lines) and depth > 0:
                      s = lines[j].strip()
                      if s.startswith('if('):
                          depth += 1
                      elif s.startswith('endif('):
                          depth -= 1
                      j += 1
                  if 'ttscarbon' in ''.join(lines[i:j]):
                      removed = True
                      i = j
                      continue
              out.append(lines[i])
              i += 1
          open(p, 'w').write(''.join(out))
          print('Removed Carbon-only if(APPLE) block' if removed else 'No Carbon if(APPLE) block found, nothing removed')
          EOF
            sed -i '' 's/\${FRAMEWORK_CARBON} *//g' utils/rbutilqt/CMakeLists.txt
            # Fresh installs defaulted to "carbon"; point macOS at the Qt
            # TextToSpeech engine (AVFoundation, the in-project replacement).
            # Harmless if Qt speech modules are absent (same fallback as today).
            sed -i '' '/RbSettings::Tts/ s/"carbon"/"qt"/' utils/rbutilqt/base/rbsettings.cpp
            # Direct users to pick a working engine when TTS init fails.
            prompt="Please open the Configuration dialog and select an available TTS engine."
            for f in utils/rbutilqt/configure.cpp utils/rbutilqt/createvoicewindow.cpp utils/rbutilqt/installtalkwindow.cpp; do
              sed -i '' "s/You can't use this TTS\./You can't use this TTS. $prompt/" "$f"
            done
            sed -i '' "s/Init of TTS engine failed/Init of TTS engine failed. $prompt/" utils/rbutilqt/base/talkgenerator.cpp
            echo "Verifying Carbon references removed from build files..."
            if grep -rn -E 'TTSCarbon|ttscarbon|FRAMEWORK_CARBON|ttsList.*carbon' utils/rbutilqt/base/ttsbase.cpp utils/rbutilqt/CMakeLists.txt; then
              echo "Carbon references remain after patching"
              exit 1
            fi
            echo "Verifying TTS default migration and configuration prompt..."
            if ! grep -q -E 'RbSettings::Tts.*"tts".*"qt"' utils/rbutilqt/base/rbsettings.cpp; then
              echo "macOS TTS default was not migrated from carbon to qt"
              exit 1
            fi
            for f in utils/rbutilqt/configure.cpp utils/rbutilqt/createvoicewindow.cpp utils/rbutilqt/installtalkwindow.cpp utils/rbutilqt/base/talkgenerator.cpp; do
              if ! grep -q "Please open the Configuration dialog" "$f"; then
                echo "TTS configuration prompt missing in $f"
                exit 1
              fi
            done
          fi

      - name: CMake Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S utils -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" \
            -G Ninja

      # Direct build attempt (dmgbuild.stamp patch removed; Carbon excised above if needed).

      - name: CMake Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --target RockboxUtility

      # No file patching — direct build attempt via cmake deploy target.
      - name: CMake Deploy (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --target deploy

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        run: mv build/RockboxUtility.dmg "build/RockboxUtility-${{ matrix.label }}.dmg"

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: TestBuild-${{ matrix.label }}-${{ github.sha }}
          path: "build/RockboxUtility-${{ matrix.label }}.dmg"
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════════
      # WINDOWS (x64 + arm64)
      # ═══════════════════════════════════════════════════════════════════
      - name: Install Qt6 via aqt (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.0 win64_mingw -O $env:RUNNER_TEMP\Qt -m qt5compat
          echo "QT_PATH=$env:RUNNER_TEMP\Qt\6.8.0\mingw_64" >> $env:GITHUB_ENV

      # Windows MinGW + Qt 6.8.0 + -mwindows needs two link-time fixes:
      # (a) Qt6EntryPoint.a references __imp___argc, missing from MinGW-w64
      # 14.x/15.x CRT → remove libQt6EntryPoint.a from build.ninja;
      # (b) -mwindows makes crtexewin.o call WinMain instead of main →
      # compile a tiny WinMain shim (winmain.o) and inject via
      # CMAKE_EXE_LINKER_FLAGS. Delegates to main().
      - name: Create WinMain shim (Windows)
        if: runner.os == 'Windows'
        run: |
          @"
          #include <windows.h>
          extern int __argc;
          extern char **__argv;
          int main(int argc, char **argv);
          int WINAPI WinMain(HINSTANCE hInst, HINSTANCE hPrev, LPSTR cmdLine, int nShow) {
              return main(__argc, __argv);
          }
          "@ > $env:RUNNER_TEMP\winmain.c
          gcc -c $env:RUNNER_TEMP\winmain.c -o $env:RUNNER_TEMP\winmain.o

      - name: CMake Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          $shim = "$env:RUNNER_TEMP\winmain.o" -replace '\\', '/'
          cmake -S utils -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.QT_PATH }}" `
            -DCMAKE_EXE_LINKER_FLAGS="$shim" `
            -G Ninja

      - name: Remove Qt6EntryPoint from build.ninja (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "import re; c=open('build/build.ninja').read(); open('build/build.ninja','w').write(re.sub(r'\S*libQt6EntryPoint\.a','',c))"

      - name: CMake Build RockboxUtility (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$env:QT_PATH\bin;$env:PATH"
          cmake --build build --target RockboxUtility

      - name: CMake Deploy (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$env:QT_PATH\bin;$env:PATH"
          cmake --build build --target deploy

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem build/RockboxUtility*.zip | Select-Object -First 1
          Move-Item $zip.FullName "build/RockboxUtility-${{ matrix.label }}.zip" -Force

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: TestBuild-${{ matrix.label }}-${{ github.sha }}
          path: "build/RockboxUtility-${{ matrix.label }}.zip"
          if-no-files-found: error
